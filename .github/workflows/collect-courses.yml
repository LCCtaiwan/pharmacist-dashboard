name: Collect pharmacist courses

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/collect-courses.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: course-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate and test
        run: npm test

      - name: Collect and build JSON/RSS
        run: npm run collect

      - name: Sync Google Sheet
        run: npm run sync:sheet
        env:
          GAS_SYNC_URL: ${{ secrets.GAS_SYNC_URL }}
          GAS_SYNC_TOKEN: ${{ secrets.GAS_SYNC_TOKEN }}

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/courses.json web/data/feed.xml
          git diff --cached --quiet || git commit -m "chore(data): refresh pharmacist courses"
          git push
